# mapping.yaml
# Declarative field mapping from source records to UM-space.
# See mapping.md for the full list of available target fields and their meaning.
#
# source: field name in the raw input record (CSV column or JSON key)
# target: dot-separated path in UM-space (product.*, offer.*, variant.*, inventory.*, fulfillment.*)
# required: if true, records missing this field are skipped (or raise error if continue_on_error: false)

mappings:
  # Required fields
  - source: "sku"
    target: "product.item_id"
    required: true
  - source: "name"
    target: "product.title"
    required: true
  - source: "description"
    target: "product.description"
    required: true
  - source: "url"
    target: "product.url"
    required: true

  # Pricing
  - source: "price"
    target: "offer.price.amount"
  - source: "currency"
    target: "offer.price.currency"

  # Images
  - source: "image_url"
    target: "product.image_url"

  # Category
  - source: "category"
    target: "product.product_category"

  # Inventory
  - source: "availability"
    target: "inventory.availability"

  # Deletion
  - source: "delete_flag"
    target: "product.delete"

continue_on_error: true
