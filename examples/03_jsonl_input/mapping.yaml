mappings:
  - source: "sku"
    target: "product.item_id"
    required: true
  - source: "title"
    target: "title"
    required: true
  - source: "item_id"
    target: "item_id"
  - source: "description"
    target: "description"
  - source: "url"
    target: "url"
  - source: "availability"
    target: "inventory.availability"

continue_on_error: true
