[tool.poetry]
name = "pfp-core"
version = "0.1.0"
description = "Python library for Stripe Product catalog and Product Feed Spec mapping, validation, and Shopify catalog workflows"
authors = ["Kutomanov Hennadii <kutomanov.hennadii@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/kutomanovhennadii/Product-Feed-Protocol"
repository = "https://github.com/kutomanovhennadii/Product-Feed-Protocol"
documentation = "https://github.com/kutomanovhennadii/Product-Feed-Protocol/tree/main/docs"
keywords = ["stripe-product-catalog", "product-feed-spec", "shopify", "shopify-catalog", "product-feed", "merchant-catalog", "product-catalog", "catalog-mapping", "catalog-validation", "catalog-transformation", "schema-validation", "agentic-commerce"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: WWW/HTTP",
]
packages = [
  { include = "pfp_core", from = "src" },
  { include = "pfp_runtime", from = "src" },
  { include = "pfp_utils", from = "src" }
]
include = [
  { path = "src/pfp_core/py.typed", format = ["sdist", "wheel"] },
  { path = "src/pfp_runtime/py.typed", format = ["sdist", "wheel"] },
  { path = "src/pfp_utils/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.8"
PyYAML = "^6.0.1"
pydantic = "^2.6.4"
ijson = "^3.2.3"
prometheus-client = {version = "^0.20.0", optional = true}
fastapi = {version = "^0.110.0", optional = true}
uvicorn = {version = "^0.23.0", optional = true}
httpx = {version = "^0.24.0", optional = true}
boto3 = {version = "^1.34.0", optional = true}
paramiko = {version = "^3.4.0", optional = true}

[tool.poetry.extras]
prometheus = ["prometheus-client"]
webhook = ["fastapi", "uvicorn", "httpx"]
s3 = ["boto3"]
sftp = ["paramiko"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.3"
pytest-timeout = "^2.3.1"
black = "^24.7b0"
isort = "^5.12.0"
mypy = "^1.7.0"
types-PyYAML = "^6.0.12.20241230"
bandit = ">=1.7.0"
pre-commit = "^3.4.0"
ruff = "^0.15.0"
pytest-cov = "<7.0.0"
boto3 = "^1.34.0"
moto = {version = "^5.0.0", extras = ["s3"]}
httpx = "^0.24.0"
paramiko = "^3.4.0"

[tool.poetry.scripts]
pfp = "pfp_runtime.integration.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"

[tool.bandit]
skips = ["B101"]
exclude = ["tests", "scripts"]

[tool.mypy]
# boto3 ships no py.typed marker. boto3-stubs would type it, but it also
# surfaces a separate batch of Optional[str] mismatches in the S3 archivers,
# so the untyped import is silenced here rather than widened into a refactor.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "perf: performance and soak tests (excluded from the default run)",
  "chaos: fault-injection tests (excluded from the default run)",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  # Protocol / abstract method bodies are declarations, never executed.
  "^\\s*\\.\\.\\.$",
]

