mappings:
  - source: "sku"
    target: "product.item_id"
    required: true
  - source: "item_id"
    target: "item_id"
  - source: "name"
    target: "title"
    required: true
  - source: "description"
    target: "description"
  - source: "url"
    target: "url"
  - source: "availability"
    target: "inventory.availability"
  - source: "delete_flag"
    target: "delete"

continue_on_error: true