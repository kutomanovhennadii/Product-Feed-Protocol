mappings:
  - source: "product_item_id"
    target: "product.item_id"
    required: true
  - source: "item_id"
    target: "item_id"
  - source: "price"
    target: "inventory.price.amount"
  - source: "currency"
    target: "inventory.price.currency"
  - source: "inventory_quantity"
    target: "inventory.quantity"
  - source: "availability"
    target: "inventory.availability"

continue_on_error: true